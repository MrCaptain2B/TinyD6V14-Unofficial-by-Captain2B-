name: Build system zip
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build deps
        run: npm ci

      - name: Bump version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          python - <<'PY'
          import json
          with open('system.json', encoding='utf-8') as f:
              d = json.load(f)
          d['version'] = '${V}'
          with open('system.json', 'w', encoding='utf-8') as f:
              json.dump(d, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PY

      - name: Build CSS (minified)
        run: npm run build:css

      - name: Stage runtime files only
        run: |
          mkdir -p stage
          cp -r assets css fonts lang module templates stage/
          cp system.json template.json README.md RELEASE-NOTES.md stage/

      - name: Create zip
        run: |
          cd stage
          zip -r "../tinyd6v14-${GITHUB_REF_NAME#v}.zip" .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "tinyd6v14-*.zip"
          draft: true
