package:module:
  stage: build
  image: node:16.17.1-alpine
  before_script:
    - apk add zip unzip
  script:
    - sed -i "s/##VERSION##/${CI_COMMIT_TAG}/g" system.json
    - npm ci
    - node_modules/.bin/gulp css
    - zip -r foundry-tinyd6-${CI_COMMIT_TAG}.zip assets css fonts lang module templates system.json README.md RELEASE-NOTES.md
  artifacts:
    untracked: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+.\d+.\d+$/
    - when: manual
